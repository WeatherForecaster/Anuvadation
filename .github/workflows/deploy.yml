name: Deploy Anuvadation

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: GitHubActionsAnuvadation

      - name: Deploy to EC2
        env:
          INSTANCE_ID: i-0d478cf36d783f239
          AWS_REGION: ap-south-1
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters 'commands=[
              "set -e",
              "cd /home/ec2-user/Anuvadation",
              "git pull --ff-only origin main",
              "export JAVA_HOME=/usr/lib/jvm/java-27-amazon-corretto.x86_64",
              "export PATH=$JAVA_HOME/bin:$PATH",
              "mvn clean package",
              "sudo systemctl restart anuvadation",
              "sudo systemctl is-active --quiet anuvadation"
            ]' \
            --comment "Deploy Anuvadation from GitHub Actions" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command started: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"
          then
            echo "Deployment failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION"

            exit 1
          fi

          echo "Deployment completed successfully."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" \
            --output text